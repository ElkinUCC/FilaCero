# Formato y estilo del backend (mismas reglas que el proyecto de referencia).
#   black .          -> formatea
#   ruff check .     -> revisa estilo y errores comunes

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations|venv"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Textos en español del asistente: se prioriza la legibilidad de cada frase.
"app/dominios/asistente/*" = ["E501"]
"app/dominios/reclamos/asistente.py" = ["E501"]
"app/dominios/agentes/tablero.py" = ["E501"]
# Pruebas y scripts: nombres y mensajes descriptivos largos.
"tests/*" = ["E501"]
"scripts/*" = ["E501"]
