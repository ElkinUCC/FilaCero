<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FilaCero · Turnos</title>
    <meta name="theme-color" content="#0f2a2e" />
    <!-- Seguridad en localhost: solo scripts propios (sin scripts en línea) y llamadas a la API del puerto 5000. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://*:5000; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />

    <!-- Estilos: HTML + CSS + JavaScript puro (sin frameworks ni librerías). -->
    <!-- El orden importa: base y componentes primero, cada página después y responsive al final. -->
    <link rel="stylesheet" href="src/css/index.css" />
    <link rel="stylesheet" href="src/css/ui.css" />
    <link rel="stylesheet" href="src/css/cliente.css" />
    <link rel="stylesheet" href="src/css/sala.css" />
    <link rel="stylesheet" href="src/css/agente.css" />
    <link rel="stylesheet" href="src/css/admin.css" />
    <link rel="stylesheet" href="src/css/asistente.css" />
    <link rel="stylesheet" href="src/css/paginas.css" />
    <link rel="stylesheet" href="src/css/vanilla.css" />
    <link rel="stylesheet" href="src/css/responsive.css" />
  </head>
  <body>
    <!-- Contenedor único del SPA: main.js pinta aquí la página de la ruta actual. -->
    <div id="app"></div>

    <!-- Avisos breves (toasts) y aviso de servidor lento. -->
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <!-- Configuración (URL del backend y organización) y punto de entrada. -->
    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
